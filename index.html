<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Movimiento es vida</title>
<meta name="theme-color" content="#121614">
<meta name="description" content="Movimiento es vida · Puerto Gris. Lector de la historia.">
<style>
  /* Paleta de Movimiento es vida: tinta, hueso, niebla y brasa. Oscuro por defecto. */
  :root{
    --bg:#121614; --fg:#e8e2d4; --muted:#9aa198; --rule:rgba(232,226,212,.14); --accent:#d6a35c; --card:#1a201d;
    --measure:38rem; --fs:1; --lh:1.7; --pgap:1em; --pad:1.25rem; --align:justify;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font:var(--serif);
  }
  :root[data-theme="light"]{--bg:#ece7da;--fg:#1d2420;--muted:#5f6760;--rule:#cfc8b6;--accent:#8a5d1e;--card:#f5f1e6}
  :root[data-theme="sepia"]{--bg:#f1e4c8;--fg:#3b2f22;--muted:#6e5d48;--rule:#d9c7a3;--accent:#8f4f1f;--card:#f7ecd4}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
       font-size:calc(clamp(17px,1.1vw + 12px,21px) * var(--fs));line-height:var(--lh);-webkit-font-smoothing:antialiased;
       transition:background .3s,color .3s;overflow-x:hidden}
  .ui{font-family:var(--sans)}
  header{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
  .bar{max-width:calc(var(--measure) + 8rem);margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.6rem;font-size:15px}
  .bar h1{font-family:var(--serif);font-size:1rem;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
  .bar .prog{color:var(--muted);font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums}
  button{font:inherit;font-family:var(--sans);font-size:.8rem;background:none;border:1px solid var(--rule);color:var(--muted);border-radius:999px;padding:.2rem .65rem;cursor:pointer;line-height:1.4}
  button:hover{color:var(--fg);border-color:var(--muted)}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .icon{width:2rem;height:2rem;padding:0;display:inline-grid;place-items:center;font-size:1rem}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  main{max-width:var(--measure);margin:0 auto;padding:2.6rem var(--pad) 3rem;min-height:70vh}
  .cover{text-align:center;margin:1rem 0 3rem}
  .cover .eyebrow{font-family:var(--sans);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 .9rem}
  .cover h2{font-size:2.1em;line-height:1.2;margin:0 0 .4rem;font-weight:500}
  .cover p{margin:0;color:var(--muted);font-style:italic}
  .cover::after{content:"";display:block;width:3rem;margin:1.8rem auto 0;border-top:1px solid var(--accent)}
  .cover .actions{margin-top:2rem;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
  .cover .actions button{font-size:.9rem;padding:.45rem 1.1rem}
  .cover .actions .primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  #sheet{outline:none}
  #sheet .num{font-family:var(--sans);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);text-align:center;margin:0 0 .6rem}
  #sheet .part{text-align:center;color:var(--muted);font-style:italic;margin:0 0 .4rem}
  #sheet h2{font-size:1.45em;font-weight:500;line-height:1.25;text-align:center;margin:0 0 2.2rem}
  #sheet h2::after{content:"";display:block;width:2.5rem;margin:1.2rem auto 0;border-top:1px solid var(--rule)}
  #sheet h3{font-size:1.1em;margin:1.5em 0 .8em}
  #sheet p{margin:0 0 var(--pgap);text-align:var(--align);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
  #sheet p + p{text-indent:1.5em}
  #sheet blockquote{margin:1em 0;padding-left:1em;border-left:2px solid var(--rule);color:var(--muted);font-style:italic}
  #sheet hr{border:0;text-align:center;margin:2rem 0;color:var(--muted)}
  #sheet hr::before{content:"* * *";letter-spacing:.6em}
  #sheet.narration p{font-style:italic}
  .pager{max-width:var(--measure);margin:0 auto;padding:1rem var(--pad) 4rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;font-family:var(--sans)}
  .pager button{max-width:46%;font-size:.85rem;padding:.4rem .9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pager button[disabled]{visibility:hidden}
  .end{text-align:center;color:var(--muted);font-style:italic;margin:3rem 0 0}
  .status{text-align:center;color:var(--muted);font-size:.78rem;font-family:var(--sans);padding:0 1rem 2rem}
  .dot{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--muted);margin-right:.4em;vertical-align:middle;opacity:.5}
  .dot.live{background:#5a9a5a;opacity:1}
  /* Índice */
  .panel{position:fixed;top:3.3rem;right:max(.75rem,calc((100vw - var(--measure))/2 - 3rem));z-index:5;width:min(22rem,calc(100vw - 1.5rem));
       max-height:min(75vh,calc(100vh - 4.5rem));overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px;
       box-shadow:0 8px 28px rgba(0,0,0,.25);padding:.5rem 0;display:none;font-family:var(--sans)}
  .panel.open{display:block}
  .panel .tt{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);padding:.3rem 1rem .5rem}
  #tocl{list-style:none;margin:0;padding:0}
  #tocl button{display:flex;gap:.6rem;width:100%;text-align:left;border:0;border-radius:0;padding:.5rem 1rem;font-family:var(--serif);font-size:.95rem;color:var(--fg);line-height:1.35}
  #tocl button .n{color:var(--muted);font-family:var(--sans);font-size:.75rem;min-width:1.6rem;padding-top:.15rem;font-variant-numeric:tabular-nums}
  #tocl li.brk{padding:.6rem 1rem .2rem;color:var(--muted);font-style:italic;font-size:.85rem}
  #tocl button:hover{background:var(--rule)}
  #tocl li.cur button{color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
  #settings{width:min(20rem,calc(100vw - 1.5rem));padding:.5rem 0 .8rem}
  #settings .row{display:flex;flex-direction:column;gap:.35rem;padding:.45rem 1rem;font-size:.82rem;color:var(--fg)}
  #settings .row.chk{flex-direction:row;align-items:flex-start;gap:.5rem;color:var(--muted)}
  #settings .lab{color:var(--muted);font-size:.72rem;letter-spacing:.04em}
  #settings input[type=range]{width:100%;accent-color:var(--accent)}
  #settings input[type=checkbox]{accent-color:var(--accent);margin-top:.15rem}
  .seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
  .seg button{flex:1;border:0;border-radius:0;padding:.35rem .4rem;font-size:.8rem}
  .seg button+button{border-left:1px solid var(--rule)}
  .seg button[aria-checked=true]{background:var(--accent);color:var(--bg)}
  .toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:6;background:var(--card);color:var(--fg);border:1px solid var(--rule);
         border-radius:999px;padding:.4rem .5rem .4rem 1rem;font-family:var(--sans);font-size:.85rem;box-shadow:0 6px 22px rgba(0,0,0,.25);
         display:none;align-items:center;gap:.6rem;max-width:calc(100vw - 2rem)}
  .toast.show{display:flex}
  .toast button.go{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  @media (max-width:520px){ .bar{gap:.4rem;padding:.5rem .7rem} main{padding-top:1.8rem} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="t">Movimiento es vida</h1>
    <span class="prog" id="prog" aria-live="polite"></span>
    <button id="tocbtn" class="icon" aria-expanded="false" aria-controls="toc" aria-label="Índice de capítulos" title="Índice">☰</button>
    <button id="setbtn" class="icon" aria-expanded="false" aria-controls="settings" aria-label="Ajustes de lectura" title="Ajustes de lectura">Aa</button>
  </div>
</header>
<main id="main">
  <section class="cover" id="cover"><p class="eyebrow">Puerto Gris</p><h2 id="ct">Movimiento es vida</h2><p id="cc"></p>
    <div class="actions" id="coverActions"></div></section>
  <article id="sheet" tabindex="-1" aria-live="off"></article>
</main>
<nav class="pager" aria-label="Paginación">
  <button id="prev" aria-label="Capítulo anterior">← Anterior</button>
  <button id="next" aria-label="Capítulo siguiente">Siguiente →</button>
</nav>
<p class="status" id="status"><span class="dot" id="dot"></span><span id="st">Conectando…</span></p>
<nav class="panel" id="toc" aria-label="Índice de capítulos"><div class="tt">Índice</div><ol id="tocl"></ol></nav>
<section class="panel" id="settings" role="dialog" aria-label="Ajustes de lectura">
  <div class="tt">Ajustes de lectura</div>
  <div class="row"><span class="lab" id="l-theme">Tema</span><div class="seg" role="radiogroup" aria-labelledby="l-theme" data-k="theme">
    <button role="radio" data-v="light">Claro</button><button role="radio" data-v="sepia">Papel</button><button role="radio" data-v="dark">Oscuro</button></div></div>
  <div class="row"><span class="lab" id="l-font">Tipografía</span><div class="seg" role="radiogroup" aria-labelledby="l-font" data-k="font">
    <button role="radio" data-v="serif" style="font-family:var(--serif)">Serif</button><button role="radio" data-v="sans">Sans</button></div></div>
  <div class="row"><span class="lab" id="l-align">Alineación</span><div class="seg" role="radiogroup" aria-labelledby="l-align" data-k="align">
    <button role="radio" data-v="justify">Justificado</button><button role="radio" data-v="left">Izquierda</button></div></div>
  <label class="row"><span class="lab">Tamaño</span><input type="range" data-k="fs" min="0.8" max="1.5" step="0.05"></label>
  <label class="row"><span class="lab">Ancho de columna</span><input type="range" data-k="measure" min="26" max="52" step="1"></label>
  <label class="row"><span class="lab">Interlineado</span><input type="range" data-k="lh" min="1.35" max="2.2" step="0.05"></label>
  <label class="row"><span class="lab">Entre párrafos</span><input type="range" data-k="pgap" min="0" max="1.6" step="0.1"></label>
  <label class="row"><span class="lab">Márgenes</span><input type="range" data-k="pad" min="0.75" max="4" step="0.25"></label>
  <label class="row chk"><input type="checkbox" data-k="follow"><span>Seguir: abrir automáticamente cada capítulo nuevo</span></label>
  <div class="row"><button id="reset">Restablecer</button></div>
</section>
<div class="toast" id="toast" role="status"><span id="toastMsg">Nuevo capítulo disponible</span><button class="go" id="toastGo">Ir</button><button class="icon" id="toastX" aria-label="Cerrar aviso">×</button></div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  /* ===== Contenido (API + polling) ===== */
  const API = "https://eiqhnyuibxqowqfbddgc.supabase.co/functions/v1/story-api/public_story";
  const POLL_MS = 5000;
  const qs = new URLSearchParams(location.search);
  const DEFAULT_SLUG = "movimiento-es-vida-e89c545a";
  const slug = (qs.get("s") || qs.get("slug") || location.hash.replace(/^#/, "") || DEFAULT_SLUG).trim().toLowerCase();

  const Content = {
    scenes: new Map(), // seq -> escena (deduplicadas por seq)
    story: {}, version: null, lastSeq: 0, busy: false, onChange: null,
    async fetch(since) {
      const u = API + "?slug=" + encodeURIComponent(slug) + (since ? "&since_seq=" + since : "") + "&_=" + Date.now();
      const r = await fetch(u, { cache: "no-store" });
      if (r.status === 404) throw Object.assign(new Error("notfound"), { notfound: true });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    },
    put(list) {
      const added = [], edited = [];
      for (const raw of list) {
        const s = { ...raw, seq: Number(raw.seq) }, old = this.scenes.get(s.seq);
        if (!old) added.push(s.seq);
        else if (old.content_md !== s.content_md || old.title !== s.title || old.kind !== s.kind || old.updated_at !== s.updated_at) edited.push(s.seq);
        this.scenes.set(s.seq, s);
        this.lastSeq = Math.max(this.lastSeq, s.seq);
      }
      return { added, edited };
    },
    async full() {
      let all = [], since = 0, d;
      do { d = await this.fetch(since); all = all.concat(d.scenes); since = d.scenes.length ? Number(d.scenes[d.scenes.length - 1].seq) : since; } while (d.has_more);
      const seen = new Set(all.map((s) => Number(s.seq)));
      const removed = [...this.scenes.keys()].filter((k) => !seen.has(k));
      removed.forEach((k) => this.scenes.delete(k));
      const ch = this.put(all);
      this.story = d.story || {}; this.version = d.version;
      return { ...ch, removed };
    },
    async tick() {
      if (this.busy || document.hidden) return;
      this.busy = true;
      try {
        let ch;
        if (this.version === null) ch = { ...(await this.full()), initial: true };
        else {
          const d = await this.fetch(this.lastSeq);
          this.story = d.story || this.story;
          if (d.version === this.version + d.scenes.length && !d.has_more) { ch = this.put(d.scenes); this.version = d.version; }
          else if (d.version !== this.version) ch = await this.full(); // edición o retirada: recarga completa en sitio
          else ch = { added: [], edited: [] };
        }
        this.onChange && this.onChange(ch, null);
      } catch (e) { this.onChange && this.onChange(null, e); }
      finally { this.busy = false; }
    },
  };

  /* ===== Agrupación escenas -> hojas ===== */
  // Una escena publicada = una hoja. Un chapter_break sin contenido no es hoja: se muestra
  // como encabezado de parte en la hoja siguiente y como separador en el índice.
  function buildSheets() {
    const out = []; let part = null;
    for (const s of [...Content.scenes.values()].sort((a, b) => a.seq - b.seq)) {
      const empty = !String(s.content_md || "").trim();
      if (s.kind === "chapter_break" && empty) { part = s.title || ""; continue; }
      out.push({ seq: s.seq, kind: s.kind || "scene", title: s.title || "", md: s.content_md || "", part });
      part = null;
    }
    return out;
  }

  /* ===== Markdown mínimo y seguro ===== */
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_(?!\s)(.+?)_(?=\W|$)/g, "$1<em>$2</em>");
  function md(src) {
    const out = [];
    for (const block of String(src).replace(/\r\n?/g, "\n").split(/\n{2,}/)) {
      const b = block.trim();
      if (!b) continue;
      if (/^(\*\s*\*\s*\*|-{3,}|\*{3,})$/.test(b)) { out.push("<hr>"); continue; }
      const h = b.match(/^#{1,6}\s+(.*)$/);
      if (h && !b.includes("\n")) { out.push("<h3>" + inline(h[1]) + "</h3>"); continue; }
      if (/^>\s?/.test(b)) { out.push("<blockquote><p>" + b.split("\n").map((l) => inline(l.replace(/^>\s?/, ""))).join("<br>") + "</p></blockquote>"); continue; }
      out.push("<p>" + b.split("\n").map(inline).join("<br>") + "</p>");
    }
    return out.join("");
  }

  /* ===== Motor de navegación ===== */
  const Nav = {
    sheets: [], idx: -1, // -1 = portada
    get cur() { return this.sheets[this.idx] || null; },
    go(i, opts = {}) {
      if (!this.sheets.length) return;
      i = Math.max(-1, Math.min(this.sheets.length - 1, i));
      const changed = i !== this.idx;
      this.idx = i;
      UI.renderSheet();
      if (!opts.keepScroll) scrollTo({ top: 0 });
      if (changed && !opts.silent) UI.focusSheet();
      if (this.cur) Store.save();
    },
    next() { this.go(this.idx + 1); },
    prev() { this.go(this.idx - 1); },
    goSeq(seq, opts) { const i = this.sheets.findIndex((s) => s.seq === seq); if (i >= 0) this.go(i, opts); },
  };

  /* ===== Persistencia (solo localStorage, por slug) ===== */
  const Store = {
    key: "mev-reader:progress:" + slug,
    load() { try { return JSON.parse(localStorage.getItem(this.key)) || null; } catch { return null; } },
    save() {
      const s = Nav.cur; if (!s) return;
      const h = document.documentElement.scrollHeight - innerHeight;
      try { localStorage.setItem(this.key, JSON.stringify({ seq: s.seq, title: s.title, y: Math.round(scrollY), r: h > 0 ? +(scrollY / h).toFixed(4) : 0, at: Date.now() })); } catch {}
    },
  };
  let saveT = 0;
  addEventListener("scroll", () => { if (!saveT) saveT = setTimeout(() => { saveT = 0; Store.save(); }, 400); }, { passive: true });
  addEventListener("pagehide", () => Store.save());
  document.addEventListener("visibilitychange", () => { if (document.hidden) Store.save(); });
  function restore(p) {
    Nav.goSeq(p.seq, { silent: true });
    if (!Nav.cur || Nav.cur.seq !== p.seq) return Nav.go(-1, { silent: true });
    requestAnimationFrame(() => { const h = document.documentElement.scrollHeight - innerHeight; scrollTo({ top: p.r ? p.r * h : p.y || 0 }); });
  }

  /* ===== UI ===== */
  const UI = {
    renderSheet() {
      const s = Nav.cur, sheet = $("sheet"), n = Nav.sheets.length;
      $("cover").hidden = !!s;
      if (!s) {
        sheet.innerHTML = ""; sheet.className = "";
        $("prog").textContent = n ? n + (n === 1 ? " capítulo" : " capítulos") : "";
      } else {
        sheet.className = s.kind;
        sheet.dataset.seq = s.seq;
        sheet.setAttribute("aria-label", s.title || "Capítulo " + (Nav.idx + 1));
        sheet.innerHTML = '<p class="num">Capítulo ' + (Nav.idx + 1) + " de " + n + "</p>" +
          (s.part ? '<p class="part">' + inline(s.part) + "</p>" : "") +
          (s.title ? "<h2>" + inline(s.title) + "</h2>" : "") + md(s.md) +
          (Nav.idx === n - 1 ? '<p class="end">— Continuará —</p>' : "");
        $("prog").textContent = "Capítulo " + (Nav.idx + 1) + " de " + n;
      }
      const p = Nav.sheets[Nav.idx - 1], nx = Nav.sheets[Nav.idx + 1];
      $("prev").disabled = Nav.idx < 0;
      $("prev").textContent = "← " + (p ? p.title || "Anterior" : "Portada");
      $("next").disabled = !nx;
      $("next").textContent = (nx ? nx.title || "Siguiente" : "") + " →";
      this.renderCover();
      this.markToc();
    },
    renderCover() {
      const a = $("coverActions");
      a.innerHTML = "";
      if (!Nav.sheets.length) return;
      const p = Store.load(), i = p ? Nav.sheets.findIndex((s) => s.seq === p.seq) : -1;
      const add = (txt, cls, fn, label) => { const b = document.createElement("button"); b.textContent = txt; if (cls) b.className = cls; if (label) b.setAttribute("aria-label", label); b.onclick = fn; a.appendChild(b); };
      if (i >= 0) {
        add("Continuar leyendo", "primary", () => restore(p), "Continuar leyendo: " + (Nav.sheets[i].title || "capítulo " + (i + 1)));
        add("Empezar desde el inicio", "", () => Nav.go(0));
      } else add("Empezar a leer", "primary", () => Nav.go(0));
    },
    focusSheet() { const el = Nav.cur ? $("sheet") : $("ct"); el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); },
    buildToc() {
      const ol = $("tocl"); ol.textContent = "";
      const li0 = document.createElement("li"), b0 = document.createElement("button");
      b0.innerHTML = '<span class="n">·</span><span>Portada · volver al inicio</span>';
      b0.onclick = () => { setToc(false); Nav.go(-1); }; li0.appendChild(b0); ol.appendChild(li0);
      const scenes = [...Content.scenes.values()].sort((a, b) => a.seq - b.seq);
      let i = 0;
      for (const s of scenes) {
        const li = document.createElement("li");
        if (s.kind === "chapter_break" && !String(s.content_md || "").trim()) { li.className = "brk"; li.textContent = s.title || "· · ·"; ol.appendChild(li); continue; }
        const k = i++, b = document.createElement("button");
        b.innerHTML = '<span class="n">' + (k + 1) + "</span><span>" + inline(s.title || "Capítulo " + (k + 1)) + "</span>";
        li.dataset.seq = s.seq;
        b.onclick = () => { setToc(false); Nav.go(k); };
        li.appendChild(b); ol.appendChild(li);
      }
      this.markToc();
    },
    markToc() {
      const cur = Nav.cur ? String(Nav.cur.seq) : null;
      $("tocl").querySelectorAll("li[data-seq]").forEach((li) => {
        const on = li.dataset.seq === cur; li.classList.toggle("cur", on);
        const b = li.querySelector("button"); on ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
      });
    },
    head() {
      const title = Content.story.title || "Movimiento es vida", chap = Content.story.chapter || "";
      if ($("t").textContent !== title) { $("t").textContent = title; $("ct").textContent = title; document.title = title; }
      $("cc").textContent = chap;
    },
    status(text, live) { $("st").textContent = text; $("dot").className = "dot" + (live ? " live" : ""); },
    toast(seq) {
      UI.toastSeq = seq;
      $("toast").classList.add("show");
    },
  };

  // Índice
  const toc = $("toc");
  function setToc(open) {
    toc.classList.toggle("open", open); $("tocbtn").setAttribute("aria-expanded", open ? "true" : "false");
    if (open) { setSettings(false); UI.markToc(); (toc.querySelector("li.cur button") || toc.querySelector("button"))?.focus(); toc.querySelector("li.cur")?.scrollIntoView({ block: "nearest" }); }
  }
  $("tocbtn").onclick = (e) => { e.stopPropagation(); setToc(!toc.classList.contains("open")); };
  document.addEventListener("click", (e) => { if (!toc.contains(e.target) && e.target !== $("tocbtn")) setToc(false); });

  /* ===== Preferencias ===== */
  const Prefs = {
    defaults: { theme: "dark", font: "serif", align: "justify", fs: 1, measure: 38, lh: 1.7, pgap: 1, pad: 1.25, follow: false },
    key: "mev-reader:prefs:" + slug,
    v: null,
    load() {
      let p = null;
      try { p = JSON.parse(localStorage.getItem(this.key) || localStorage.getItem("mev-reader:prefs") || "null"); } catch {}
      if (!p) { p = {}; const t = localStorage.getItem("mev-reader-theme"); if (t) p.theme = t; } // migración del lector anterior
      this.v = { ...this.defaults, ...p };
      this.apply();
    },
    set(k, val) { this.v[k] = val; this.apply(); try { const j = JSON.stringify(this.v); localStorage.setItem(this.key, j); localStorage.setItem("mev-reader:prefs", j); } catch {} },
    apply() {
      const v = this.v, st = root.style;
      root.dataset.theme = v.theme;
      st.setProperty("--font", v.font === "sans" ? "var(--sans)" : "var(--serif)");
      st.setProperty("--align", v.align); st.setProperty("--fs", v.fs); st.setProperty("--measure", v.measure + "rem");
      st.setProperty("--lh", v.lh); st.setProperty("--pgap", v.pgap + "em"); st.setProperty("--pad", v.pad + "rem");
      document.querySelector('meta[name=theme-color]').content = getComputedStyle(root).getPropertyValue("--bg").trim() || "#121614";
      document.querySelectorAll("#settings .seg").forEach((g) => g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(v[g.dataset.k] === b.dataset.v))));
      document.querySelectorAll("#settings input[type=range]").forEach((i) => { i.value = v[i.dataset.k]; i.setAttribute("aria-valuetext", String(v[i.dataset.k])); });
      document.querySelectorAll("#settings input[type=checkbox]").forEach((i) => i.checked = !!v[i.dataset.k]);
    },
  };
  Prefs.load();
  document.querySelectorAll("#settings .seg").forEach((g) => g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) Prefs.set(g.dataset.k, b.dataset.v); }));
  document.querySelectorAll("#settings input[type=range]").forEach((i) => i.addEventListener("input", () => Prefs.set(i.dataset.k, Number(i.value))));
  document.querySelectorAll("#settings input[type=checkbox]").forEach((i) => i.addEventListener("change", () => Prefs.set(i.dataset.k, i.checked)));
  $("reset").onclick = () => { Prefs.v = { ...Prefs.defaults }; Prefs.set("theme", Prefs.v.theme); };
  const sett = $("settings");
  function setSettings(open) { sett.classList.toggle("open", open); $("setbtn").setAttribute("aria-expanded", String(open)); if (open) { setToc(false); sett.querySelector("button,input").focus(); } }
  $("setbtn").onclick = (e) => { e.stopPropagation(); setSettings(!sett.classList.contains("open")); };
  document.addEventListener("click", (e) => { if (!sett.contains(e.target) && e.target !== $("setbtn")) setSettings(false); });

  // Navegación: botones, teclado, swipe
  $("prev").onclick = () => Nav.prev();
  $("next").onclick = () => Nav.next();
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (toc.classList.contains("open")) { setToc(false); $("tocbtn").focus(); } if (sett.classList.contains("open")) { setSettings(false); $("setbtn").focus(); } return; }
    if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (toc.classList.contains("open") || sett.classList.contains("open")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); Nav.next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); Nav.prev(); }
  });
  let tx = null, ty = 0;
  addEventListener("touchstart", (e) => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  addEventListener("touchend", (e) => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && !getSelection().toString()) dx < 0 ? Nav.next() : Nav.prev();
  }, { passive: true });

  // Aviso de capítulo nuevo
  $("toastGo").onclick = () => { $("toast").classList.remove("show"); Nav.goSeq(UI.toastSeq); };
  $("toastX").onclick = () => $("toast").classList.remove("show");

  /* ===== Actualización en vivo ===== */
  Content.onChange = (ch, err) => {
    if (err) {
      if (err.notfound) { UI.status("No se encontró la historia. Revisa el enlace (?s=…).", false); $("ct").textContent = "Historia no encontrada"; }
      else UI.status("Sin conexión, reintentando…", false);
      return;
    }
    UI.head();
    const curSeq = Nav.cur ? Nav.cur.seq : null;
    const dirty = ch.initial || ch.added.length || ch.edited.length || (ch.removed && ch.removed.length);
    if (dirty) {
      Nav.sheets = buildSheets();
      UI.buildToc();
      if (ch.initial) { const p = Store.load(); p ? restore(p) : Nav.go(-1, { silent: true }); }
      else {
        // Conservar la hoja y la posición actuales; nunca mover al lector.
        let i = curSeq === null ? -1 : Nav.sheets.findIndex((s) => s.seq === curSeq);
        if (curSeq !== null && i < 0) i = Math.min(Nav.idx, Nav.sheets.length - 1);
        const y = scrollY;
        Nav.idx = i; UI.renderSheet(); scrollTo({ top: y });
        const fresh = ch.added.map((q) => Nav.sheets.find((s) => s.seq === q)).filter(Boolean);
        if (fresh.length) { if (Prefs.v.follow) Nav.goSeq(fresh[0].seq); else UI.toast(fresh[0].seq); }
      }
    }
    const n = Nav.sheets.length;
    UI.status(n ? "En vivo · " + n + (n === 1 ? " capítulo" : " capítulos") : "En vivo · aún no hay capítulos publicados", true);
  };

  document.addEventListener("visibilitychange", () => { if (!document.hidden) Content.tick(); });

  if (!/^[a-z0-9][a-z0-9-]{2,63}$/.test(slug)) {
    $("ct").textContent = "¿Qué historia quieres leer?";
    UI.status("", false);
    const f = document.createElement("form");
    f.className = "status";
    f.innerHTML = '<input id="sl" aria-label="Slug de la historia" placeholder="slug de la historia" autocomplete="off" style="font:inherit;padding:.3rem .6rem;border:1px solid var(--rule);background:var(--card);color:var(--fg);border-radius:6px"> <button>Leer</button>';
    f.onsubmit = (e) => { e.preventDefault(); const v = $("sl").value.trim().toLowerCase(); if (v) location.hash = v, location.reload(); };
    $("cover").appendChild(f);
    return;
  }
  window.__mev = { Content, Nav, UI };
  Content.tick();
  setInterval(() => Content.tick(), POLL_MS);
})();
</script>
</body>
</html>
