<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Movimiento es vida</title>
<meta name="theme-color" content="#121614">
<meta name="description" content="Movimiento es vida · Puerto Gris. Lector de la historia.">
<style>
  /* Paleta de Movimiento es vida: tinta, hueso, niebla y brasa. Oscuro por defecto. */
  :root{
    --bg:#121614; --fg:#e8e2d4; --muted:#9aa198; --rule:rgba(232,226,212,.14); --accent:#d6a35c; --card:#1a201d;
    --measure:38rem;
  }
  :root[data-theme="light"]{
    --bg:#ece7da; --fg:#1d2420; --muted:#69716a; --rule:#cfc8b6; --accent:#9a6a26; --card:#f5f1e6;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
       font-size:clamp(17px,1.1vw + 12px,21px);line-height:1.7;-webkit-font-smoothing:antialiased;
       transition:background .3s,color .3s}
  header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);
         backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
  .bar{max-width:var(--measure);margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem}
  .bar h1{font-size:1rem;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
  .bar .chap{color:var(--muted);font-style:italic;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  button{font:inherit;font-size:.8rem;background:none;border:1px solid var(--rule);color:var(--muted);
         border-radius:999px;padding:.15rem .6rem;cursor:pointer}
  button:hover{color:var(--fg);border-color:var(--muted)}
  main{max-width:var(--measure);margin:0 auto;padding:3rem 1.25rem 40vh}
  .cover{text-align:center;margin:2rem 0 3.5rem}
  .cover h2{font-size:2.1em;line-height:1.2;margin:0 0 .4rem;font-weight:500}
  .cover p{margin:0;color:var(--muted);font-style:italic}
  .cover .eyebrow{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-style:normal;margin-bottom:.9rem}
  .cover h2 em{color:var(--accent)}
  .cover::after{content:"";display:block;width:3rem;margin:1.8rem auto 0;border-top:1px solid var(--accent)}
  article{margin:0 0 2.6rem;opacity:1;transition:opacity .9s ease, transform .9s ease}
  article.enter{opacity:0;transform:translateY(12px)}
  article h3{font-size:1.15em;font-weight:600;margin:0 0 1rem;letter-spacing:.01em}
  article p{margin:0 0 1em;text-align:justify;hyphens:auto}
  article p + p{text-indent:1.5em;margin-top:-.5em}
  article blockquote{margin:1em 0;padding-left:1em;border-left:2px solid var(--rule);color:var(--muted);font-style:italic}
  article hr,.sep{border:0;text-align:center;margin:2rem 0;color:var(--muted)}
  article hr::before{content:"* * *";letter-spacing:.6em}
  article.narration p{font-style:italic;color:color-mix(in srgb,var(--fg) 80%,var(--muted))}
  article.chapter_break{text-align:center;margin:4.5rem 0 3rem}
  article.chapter_break::before{content:"";display:block;width:4rem;margin:0 auto 1.6rem;border-top:1px solid var(--rule)}
  article.chapter_break h3{font-size:1.5em;font-weight:500;margin-bottom:.4rem}
  article.chapter_break p{text-align:center;text-indent:0!important;color:var(--muted);font-style:italic}
  .status{text-align:center;color:var(--muted);font-size:.85rem;font-style:italic}
  .dot{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--muted);margin-right:.4em;vertical-align:middle;opacity:.5}
  .dot.live{background:#5a9a5a;opacity:1}
  .pill{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--accent);color:#fff;border:0;
        padding:.45rem 1rem;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.2);display:none}
  .pill:hover{color:#fff}
  .pill.show{display:block}
  /* Menú de capítulos */
  article{scroll-margin-top:4.5rem}
  #toc{position:fixed;top:3.2rem;right:max(.75rem,calc((100vw - var(--measure))/2));z-index:3;width:min(20rem,calc(100vw - 1.5rem));
       max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px;
       box-shadow:0 8px 28px rgba(0,0,0,.25);padding:.5rem 0;display:none}
  #toc.open{display:block}
  #toc .tt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);padding:.3rem 1rem .5rem}
  #toc ol{list-style:none;margin:0;padding:0}
  #toc li button{display:block;width:100%;text-align:left;border:0;border-radius:0;padding:.45rem 1rem;font-size:.9rem;color:var(--fg);line-height:1.35}
  #toc li.brk button{font-style:italic;color:var(--muted)}
  #toc li button:hover{background:var(--rule)}
  @media (max-width:520px){.bar .chap{display:none}.bar{gap:.45rem}}
  #toc li.cur button{color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="t">Movimiento es vida</h1>
    <span class="chap" id="c"></span>
    <button id="tocbtn" aria-expanded="false" aria-controls="toc" title="Índice de capítulos">Capítulos</button>
    <button id="follow" title="Desplazarse automáticamente a cada escena nueva">Seguir: sí</button>
    <button id="theme" title="Modo claro / oscuro">◐</button>
  </div>
</header>
<main>
  <section class="cover"><p class="eyebrow">Puerto Gris</p><h2 id="ct">Movimiento es vida</h2><p id="cc"></p></section>
  <div id="scenes"></div>
  <p class="status" id="status"><span class="dot" id="dot"></span><span id="st">Conectando…</span></p>
</main>
<nav id="toc" aria-label="Capítulos"><div class="tt">Capítulos</div><ol id="tocl"></ol></nav>
<button class="pill" id="pill">Escena nueva ↓</button>
<script>
(() => {
  "use strict";
  const API = "https://eiqhnyuibxqowqfbddgc.supabase.co/functions/v1/story-api/public_story";
  const POLL_MS = 5000;
  const qs = new URLSearchParams(location.search);
  const DEFAULT_SLUG = "movimiento-es-vida-e89c545a"; // Movimiento es vida
  const slug = (qs.get("s") || qs.get("slug") || location.hash.replace(/^#/, "") || DEFAULT_SLUG).trim().toLowerCase();
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  // ---- theme ----
  const saved = localStorage.getItem("mev-reader-theme");
  if (saved) root.dataset.theme = saved;
  $("theme").onclick = () => {
    const dark = root.dataset.theme !== "light";
    root.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("mev-reader-theme", root.dataset.theme);
  };
  let follow = localStorage.getItem("mev-reader-follow") !== "0";
  const paintFollow = () => $("follow").textContent = "Seguir: " + (follow ? "sí" : "no");
  paintFollow();
  $("follow").onclick = () => { follow = !follow; localStorage.setItem("mev-reader-follow", follow ? "1" : "0"); paintFollow(); };

  // ---- tiny, safe markdown (escape first, then a few inline rules) ----
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_(?!\s)(.+?)_(?=\W|$)/g, "$1<em>$2</em>");
  function md(src) {
    const out = [];
    for (const block of String(src).replace(/\r\n?/g, "\n").split(/\n{2,}/)) {
      const b = block.trim();
      if (!b) continue;
      if (/^(\*\s*\*\s*\*|-{3,}|\*{3,})$/.test(b)) { out.push("<hr>"); continue; }
      const h = b.match(/^#{1,6}\s+(.*)$/);
      if (h && !b.includes("\n")) { out.push("<h3>" + inline(h[1]) + "</h3>"); continue; }
      if (/^>\s?/.test(b)) { out.push("<blockquote><p>" + b.split("\n").map((l) => inline(l.replace(/^>\s?/, ""))).join("<br>") + "</p></blockquote>"); continue; }
      out.push("<p>" + b.split("\n").map(inline).join("<br>") + "</p>");
    }
    return out.join("");
  }

  function sceneEl(s) {
    const a = document.createElement("article");
    a.className = s.kind || "scene";
    a.dataset.seq = s.seq;
    a.id = "escena-" + s.seq;
    a.innerHTML = (s.title ? "<h3>" + inline(s.title) + "</h3>" : "") + md(s.content_md || "");
    return a;
  }

  // ---- state + polling ----
  let lastSeq = 0, version = null, busy = false, timer = null, fails = 0;
  const list = $("scenes");

  function setHead(story) {
    const title = story.title || "Movimiento es vida", chap = story.chapter || "";
    if ($("t").textContent !== title) { $("t").textContent = title; $("ct").textContent = title; document.title = title; }
    if ($("c").textContent !== chap) { $("c").textContent = chap; $("cc").textContent = chap; }
  }
  function status(text, live) { $("st").textContent = text; $("dot").className = "dot" + (live ? " live" : ""); }
  const nearBottom = () => innerHeight + scrollY >= document.body.scrollHeight - 400;

  async function fetchJSON(since) {
    const u = API + "?slug=" + encodeURIComponent(slug) + (since ? "&since_seq=" + since : "") + "&_=" + Date.now();
    const r = await fetch(u, { cache: "no-store" });
    if (r.status === 404) throw Object.assign(new Error("notfound"), { notfound: true });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function render(scenes, animate) {
    let first = null;
    for (const s of scenes) {
      const el = sceneEl(s);
      if (animate) el.classList.add("enter");
      list.appendChild(el);
      if (!first) first = el;
      lastSeq = Math.max(lastSeq, s.seq);
    }
    buildToc();
    if (animate && first) {
      requestAnimationFrame(() => list.querySelectorAll("article.enter").forEach((e) => e.classList.remove("enter")));
      if (follow || nearBottom()) first.scrollIntoView({ behavior: "smooth", block: "start" });
      else $("pill").classList.add("show");
    }
  }

  async function full(animate) {
    let all = [], since = 0, d;
    do { d = await fetchJSON(since); all = all.concat(d.scenes); since = d.scenes.length ? d.scenes[d.scenes.length - 1].seq : since; } while (d.has_more);
    setHead(d.story);
    const y = scrollY;
    list.textContent = ""; lastSeq = 0;
    render(all, false);
    if (!animate) scrollTo({ top: y });
    version = d.version;
  }

  async function tick() {
    if (busy || document.hidden) return;
    busy = true;
    try {
      if (version === null) await full(false);
      else {
        const d = await fetchJSON(lastSeq);
        setHead(d.story);
        const onlyAppends = d.version === version + d.scenes.length && !d.has_more;
        if (onlyAppends) { render(d.scenes, true); version = d.version; }
        else if (d.version !== version) await full(false); // an edit/unpublish happened: re-render in place
      }
      fails = 0;
      const n = list.children.length;
      status(n ? "En vivo · " + n + (n === 1 ? " escena" : " escenas") : "En vivo · aún no hay escenas publicadas", true);
    } catch (e) {
      fails++;
      if (e.notfound) { status("No se encontró la historia. Revisa el enlace (?s=…).", false); $("ct").textContent = "Historia no encontrada"; }
      else status("Sin conexión, reintentando…", false);
    } finally { busy = false; }
  }

  // ---- menú de capítulos ----
  const toc = $("toc"), tocl = $("tocl");
  const setToc = (open) => { toc.classList.toggle("open", open); $("tocbtn").setAttribute("aria-expanded", open ? "true" : "false"); if (open) markCur(); };
  $("tocbtn").onclick = (e) => { e.stopPropagation(); setToc(!toc.classList.contains("open")); };
  document.addEventListener("click", (e) => { if (!toc.contains(e.target)) setToc(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setToc(false); });
  function buildToc() {
    tocl.textContent = "";
    list.querySelectorAll("article[data-seq]").forEach((a, i) => {
      const li = document.createElement("li"), b = document.createElement("button");
      const h = a.querySelector(":scope > h3");
      b.textContent = (h && h.textContent.trim()) || "Escena " + (i + 1);
      li.dataset.seq = a.dataset.seq;
      if (a.classList.contains("chapter_break")) li.className = "brk";
      b.onclick = () => { setToc(false); a.scrollIntoView({ behavior: "smooth", block: "start" }); };
      li.appendChild(b); tocl.appendChild(li);
    });
    markCur();
  }
  function markCur() {
    let cur = null;
    for (const a of list.querySelectorAll("article[data-seq]")) { if (a.getBoundingClientRect().top <= 120) cur = a.dataset.seq; else break; }
    tocl.querySelectorAll("li").forEach((li) => li.classList.toggle("cur", li.dataset.seq === cur));
  }
  let tocRaf = 0;
  addEventListener("scroll", () => { if (!tocRaf) tocRaf = requestAnimationFrame(() => { tocRaf = 0; markCur(); }); }, { passive: true });

  $("pill").onclick = () => { $("pill").classList.remove("show"); list.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "start" }); };
  addEventListener("scroll", () => { if (nearBottom()) $("pill").classList.remove("show"); }, { passive: true });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

  if (!/^[a-z0-9][a-z0-9-]{2,63}$/.test(slug)) {
    $("ct").textContent = "¿Qué historia quieres leer?";
    status("", false);
    const f = document.createElement("form");
    f.className = "status";
    f.innerHTML = '<input id="sl" placeholder="slug de la historia" autocomplete="off" style="font:inherit;padding:.3rem .6rem;border:1px solid var(--rule);background:var(--card);color:var(--fg);border-radius:6px"> <button>Leer</button>';
    f.onsubmit = (e) => { e.preventDefault(); const v = $("sl").value.trim().toLowerCase(); if (v) location.hash = v, location.reload(); };
    $("scenes").appendChild(f);
    return;
  }
  tick();
  timer = setInterval(tick, POLL_MS);
})();
</script>
</body>
</html>
